name: Release

# A release is made from a tag and from nothing else. The tag carries the
# version with a leading v, and the job refuses to publish unless the canonical
# INI and the changelog agree with it, which tools\Package.ps1 checks.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' is not a semantic version tag of the form vX.Y.Z"
          }
          $version = $Matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive=TextureSwapper-v$version.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Release Win32
        run: msbuild TextureSwapper.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m

      - name: Stage and package release
        shell: pwsh
        run: ./tools/Package.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $changelog = Get-Content -Raw -LiteralPath 'CHANGELOG.md'
          $pattern = '(?sm)^##[ \t]+' + [regex]::Escape($version) + '[ \t]*\r?\n(.*?)(?=^##[ \t]|\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md has no section for $version"
          }
          $body = $section.Groups[1].Value.Trim()
          Set-Content -LiteralPath 'release-notes.md' -Value $body -Encoding utf8

      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/${{ steps.version.outputs.archive }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'build/${{ steps.version.outputs.archive }}'
          foreach ($asset in @($archive, "$archive.sha256")) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "the build produced no $asset"
            }
          }
          gh release create '${{ github.ref_name }}' $archive "$archive.sha256" `
            --title 'Texture Swapper ${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) {
            throw 'could not create the release'
          }
